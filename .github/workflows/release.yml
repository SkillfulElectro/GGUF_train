name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends build-essential curl ca-certificates

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build

      - name: Build native libraries (ggml + llama.cpp bridge)
        run: |
          python build_native.py -j 4 --refresh-llama
        env:
          GGUF_TRAIN_BUILD_JOBS: "4"

      - name: Build platform wheel and sdist
        run: |
          rm -rf dist build *.egg-info
          python -m pip wheel . --no-deps --no-build-isolation -w dist
          python setup.py sdist --dist-dir dist
          ls -lh dist

      - name: Create GitHub release and upload prebuilt binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG="$(git tag --sort=-version:refname | grep -E '^v[0-9]' | grep -v "^${TAG}$" | head -n 1 || true)"
          if [ -n "$PREV_TAG" ]; then
            NOTES_FILE="$(mktemp)"
            git log "${PREV_TAG}..${TAG}" --pretty=format:'- %s (%h)' > "$NOTES_FILE"
            gh release create "${TAG}" dist/* \
              --title "${TAG}" \
              --notes-file "$NOTES_FILE" \
              --generate-notes
          else
            gh release create "${TAG}" dist/* \
              --title "${TAG}" \
              --generate-notes
          fi

      - name: Publish to PyPI (maintainers only, requires PYPI_TOKEN secret)
        if: secrets.PYPI_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
